<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B10" />
    <meta
      name="description"
      content="InsightMart turns a raw sales CSV into revenue trends, top performers, profitability and an exportable report."
    />
    <title>InsightMart — Sales Analytics &amp; Reporting</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('insightmart.theme');
          var mode = stored ? JSON.parse(stored) : 'dark';
          var resolved =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BNQBvu12.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CMUGeaiV.css">
  </head>

  </body>
</html>
